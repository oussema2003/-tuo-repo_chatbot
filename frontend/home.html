<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Restaurant Fast Food</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <!-- Script officiel Dialogflow Messenger -->
    <script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>
    <df-messenger
      intent="WELCOME"
      chat-title="mira-chatbot"
      agent-id="bdcf124c-87b6-4765-a6b9-467a34274cfa"
      language-code="en"
    ></df-messenger>
</head>
<body>
	<div class="container">
    <header>
        <nav>
            <a href="#home">HOME</a> |
            <a href="#menu">MENU</a> |
            <a href="#location">LOCATION</a> |
            <a href="#aboutus">ABOUT US</a> |
            <a href="#contactus">CONTACT US</a>
        </nav>
    </header>

    <section id="home">
		<img src="banner.jpg" alt="Restaurant banner">
    </section>

    <section id="menu">
        <h2>Our Menu</h2>
        <div class="grid-container">
            <img src="menu1.jpg" alt="Menu item 1">
            <img src="menu2.jpg" alt="Menu item 2">
            <img src="menu3.jpg" alt="Menu item 3">
        </div>
    </section>

    <section id="location">
        <h2>Location</h2>
        <p>38 Patli Gali, Mumbai</p>
    </section>

    <section id="contactus">
        <h2>Contact Us</h2>
        <p>Got questions? Want to place an order? Call us at +91791234567 or email us at info@atliqfastfood.com</p>
    </section>

    <!-- Nouveau Chatbot (Dialogflow Messenger) -->
    <df-messenger
      chat-title="Assistant"
      agent-id="TON_AGENT_ID"
      language-code="fr">
    </df-messenger>

	</div>
</body>
</html>
